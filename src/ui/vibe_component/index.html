<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://js.puter.com/v2/"></script>
<style>
  body {
    margin: 0; padding: 4px 0 2px 0; background: transparent;
    font-family: 'Manrope', system-ui, sans-serif;
  }
  #vibe-input {
    width: 100%; box-sizing: border-box;
    background: #141923; color: #e8eaf0;
    border: 1px solid #232b3a; border-radius: 10px;
    padding: 0.55rem 0.8rem; font-size: 0.95rem; outline: none;
  }
  #vibe-input:focus { border-color: #b8940e; }
  #vibe-btn {
    margin-top: 0.5rem; width: 100%;
    background: linear-gradient(120deg, #f5c518, #e0af10); color: #151002;
    border: none; border-radius: 10px; padding: 0.5rem; font-weight: 800;
    cursor: pointer; font-size: 0.9rem; font-family: inherit;
    transition: filter .15s ease;
  }
  #vibe-btn:hover { filter: brightness(1.08); }
  #vibe-btn:disabled { opacity: .55; cursor: wait; }
  #vibe-status { color: #9aa3b5; font-size: 0.8rem; margin-top: 0.45rem; min-height: 1em; }
</style>
</head>
<body>
  <input id="vibe-input"
         placeholder="e.g. rainy noir city, lonely detective, mind games" />
  <button id="vibe-btn">&#10024; Match my vibe</button>
  <div id="vibe-status"></div>

<script>
(function () {
  const input = document.getElementById('vibe-input');
  const btn = document.getElementById('vibe-btn');
  const status = document.getElementById('vibe-status');

  // ---- Streamlit custom-component protocol (API v1) ----
  function post(type, data) {
    window.parent.postMessage(Object.assign(
      { isStreamlitMessage: true, type: type, apiVersion: 1 }, data), '*');
  }
  function setComponentReady() { post('streamlit:componentReady', {}); }
  function setFrameHeight(h) { post('streamlit:setFrameHeight', { value: h }); }
  function sendValue(value) { post('streamlit:setComponentValue', { value: value }); }

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'streamlit:render') {
      setFrameHeight(document.body.scrollHeight + 8);
    }
  });

  btn.addEventListener('click', async () => {
    const q = input.value.trim();
    if (!q) { status.textContent = 'Describe the movie feeling first...'; return; }
    btn.disabled = true;
    status.textContent = 'Reading your vibe...';
    try {
      const prompt =
        'You extract movie search filters. For the user movie vibe description, ' +
        'reply ONLY with compact JSON: {"genres":[...],"keywords":[...],"search":"..."}. ' +
        'Rules: genres use standard names like Action, Comedy, Crime, Drama, Fantasy, ' +
        'Horror, Mystery, Romance, Sci-Fi, Thriller, Western, Animation, Documentary, ' +
        'War, History, Music, Family. Use 1-3 genres max, 3-6 short lowercase keywords, ' +
        'and "search" = zero to two words likely in a matching movie title. ' +
        'Vibe: ' + q;
      const resp = await puter.ai.chat(prompt);
      const text = (resp && resp.message && resp.message.content)
        ? resp.message.content
        : (typeof resp === 'string' ? resp : JSON.stringify(resp));
      const m = String(text).match(/\{[\s\S]*\}/);
      if (!m) throw new Error('no json');
      const parsed = JSON.parse(m[0]);
      sendValue({
        ok: true, ts: Date.now(), vibe: q,
        genres: parsed.genres || [], keywords: parsed.keywords || [],
        search: parsed.search || ''
      });
      status.textContent = 'Vibe captured - matching below...';
    } catch (err) {
      status.textContent = 'AI unavailable - the rest of CineMatch still works.';
      sendValue({ ok: false, ts: Date.now(), vibe: q, genres: [],
                  keywords: [], search: '' });
    } finally {
      btn.disabled = false;
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); btn.click(); }
  });

  setComponentReady();
})();
</script>
</body>
</html>
